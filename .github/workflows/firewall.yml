name: firewall

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files against denylist
        # ⚠️ SHA-pinned, unlike every other shared action here, which use @v1.
        # Not inconsistency — this is the only shared action that is a GATE, and
        # a compromised gate does not break the build, it returns a GREEN CHECK on
        # a repo whose scan is no longer running. Silent-clean is the failure mode
        # the whole firewall exists to prevent. Bump deliberately, reading the diff.
        uses: arqtiqa/arqtos-actions/.github/actions/firewall@aaaf6d5da05725b6c2b0d08ddd651b68d9ad84af  # v1.2.0
        with:
          # ⚠️ The denylist stays HERE and is passed in. The shared action ships
          # none: a denylist is a list of the things it protects, so a copy in a
          # public repo publishes what it guards. This repo's list is the
          # sanitised subset appropriate to its audience; the internal-only
          # patterns live only in internal repos.
          denylist: .github/scripts/private-content-denylist.txt
